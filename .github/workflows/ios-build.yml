name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test and build iOS
    runs-on: macos-15
    timeout-minutes: 30

    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: dart analyze

      # flutter test 而不是 dart test。
      #
      # dart test 跑不動任何 import 到 Flutter SDK 的測試 —— 它沒有 dart:ui，
      # 載入階段就會失敗（不是斷言失敗，是整個檔案讀不進來）。這個專案的測試
      # 一直到最近都是純 Dart，所以 dart test 一直夠用；現在有兩個不是：
      # theme_contrast_test 要 Color，ledger_test 是 widget test。
      #
      # flutter test 兩種都跑得動，純 Dart 的那些也照樣跑。
      - name: Run tests
        run: flutter test --reporter compact

      - name: Install iOS dependencies
        working-directory: flutter_app/ios
        run: pod install

      # APP_VERSION 進診斷資訊那一區。這個 app 沒有自動更新，使用者手上那台
      # 跑的是哪一版從外面看不出來 —— 而「他跑的是舊版」是回報問題時第一個
      # 要排除的可能。沒帶的話畫面上會寫「未帶版本號（開發建置）」。
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign --dart-define=APP_VERSION="${GITHUB_SHA::7} $(date -u +%Y-%m-%d)"

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: simple-split-ios-unsigned
          path: flutter_app/build/ios/iphoneos/Runner.app
          retention-days: 7
          if-no-files-found: error
