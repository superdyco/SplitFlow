# 單元測試、型別檢查與 Security Rules。
#
# Rules 特別值得放在 CI：規則會一直改，而改錯的代價是資料外洩或整個功能寫不進去
# —— 那是最不該只靠「某台筆電上跑得起來」的東西。這個 repo 的 rules 測試曾經
# 因為本機 JDK 版本不夠而擱置了一段時間，正是這種依賴的例子。
#
# emulator 是 Java 程式，GitHub 的 runner 內建 JDK，所以這裡不用自己裝。
name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Types, tests and rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 24，因為 package-lock.json 是 npm 11 產的（Node 24 內建）。
      # 22 帶的是 npm 10，而兩者對「選用的 peer 相依」處置不同 —— vitest 底下
      # 那個 vite 把 esbuild 列為 optional peer，npm 11 不裝它、也不寫進 lock，
      # npm 10 則認為它該在，於是 `npm ci` 報一整排 Missing: @esbuild/* 然後死掉。
      # 鎖同一個大版本比在 lock 檔上追著補漏洞可靠。
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `src/firebase/config.ts` 在被 import 的當下就 getAuth()，而 API key 是空的
      # 話會直接丟 auth/invalid-api-key —— 只要有一個測試 import 到那條鏈上的任何
      # 模組（例如 dataExportService），整個檔案就掛在載入階段。
      #
      # 填假值而不是把真的搬進 secrets：這些值本來就會被打包進前端、本來就是公開的
      # （真正的防線是 rules 與 Authorized domains），而 CI 不需要連上真的專案 ——
      # 單元測試是純函式，建置只是把字串嵌進去，產物也不會被部署。
      - name: Write a placeholder .env
        run: |
          cat > .env <<'ENV'
          VITE_FIREBASE_API_KEY=ci-placeholder-key
          VITE_FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=ci
          VITE_FIREBASE_STORAGE_BUCKET=ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=0
          VITE_FIREBASE_APP_ID=1:0:web:0
          ENV

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Run unit tests
        run: npm test

      # 這一步會下載 Firestore 與 Storage 的 emulator，是整個 job 最慢的一段。
      - name: Run security rules tests
        run: npm run test:rules

      # 建置本身也是一種檢查：chunk 的循環相依在這裡才會被抓到。
      - name: Build
        run: npm run build
