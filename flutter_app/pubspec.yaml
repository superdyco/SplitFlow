name: splitflow
description: SplitFlow 的 Flutter 版本。分帳、多幣別、離線記帳。
publish_to: "none"
version: 0.1.0

environment:
  # CI 使用 Flutter 3.47 / Dart 3.12。app_links 7.x 也以 Dart 3.12 為最低版本。
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase。版本先不鎖死到 patch，第一次 `flutter pub get` 之後
  # pubspec.lock 會把實際解出來的版本釘住。
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # 推播。只註冊／清除 token 與問權限 —— 真正決定要通知誰的是
  # Cloud Function（見 functions/src/index.ts）。
  firebase_messaging: ^15.1.3

  # 接收 Android App Links 與 iOS Universal Links。邀請網址仍是同一條
  # https 網址；有安裝 App 才由系統轉進原生版，沒安裝就照常開網頁。
  app_links: ^7.2.1

  # 呼叫 Android / iOS 原生分享選單，傳送邀請連結與結算文字。
  share_plus: ^13.3.0

  # 狀態管理。選 Riverpod 是因為 provider 的取用不綁 widget tree，
  # 領域邏輯那層可以完全不知道 Flutter 存在 —— 跟現在 composables 的分法一致。
  flutter_riverpod: ^2.5.1

  # 路由。網頁版的 /r/:taskId/:reportId 那種深層連結要能對得上。
  go_router: ^14.2.7

  google_sign_in: ^7.0.0

  http: ^1.2.0

  # 地點下面那張地圖，以及「我現在在哪」。
  #
  # 地圖用原生的 Google Maps view（跟網頁版的 Maps JavaScript API 對應），
  # 金鑰**不是**走 --dart-define：原生 SDK 是從 AndroidManifest 讀的，
  # 所以那把金鑰由 android/local.properties 經 gradle 填進 manifest。
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.0

  # 拍照與從相簿選。內建 maxWidth/maxHeight/imageQuality，縮放跟轉 JPEG
  # 都是原生做的 —— 網頁版那邊要自己開 canvas 畫一次才做得到同樣的事。
  image_picker: ^1.1.0

  # 只拿來記「每個任務最後用過的座標」，當作下次地點搜尋的位置偏好。
  # 網頁版那邊是 localStorage，同樣是可有可無的資料 —— 讀不到就沒有偏好。
  shared_preferences: ^2.3.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 領域層的測試用純 Dart 的 package:test，不是 flutter_test。
  #
  # 這不只是輕量的問題 —— 它讓「lib/domain/ 不准 import Flutter」變成一件
  # 編譯器會抓的事，而不是靠自律。算錢的邏輯要能在沒有 widget 環境的地方
  # 驗證，跟網頁版把純函式跟 Vue 分開是同一個理由。
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app-logo.png
