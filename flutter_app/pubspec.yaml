name: splitflow
description: SplitFlow 的 Flutter 版本。分帳、多幣別、離線記帳。
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase。版本先不鎖死到 patch，第一次 `flutter pub get` 之後
  # pubspec.lock 會把實際解出來的版本釘住。
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4

  # 狀態管理。選 Riverpod 是因為 provider 的取用不綁 widget tree，
  # 領域邏輯那層可以完全不知道 Flutter 存在 —— 跟現在 composables 的分法一致。
  flutter_riverpod: ^2.5.1

  # 路由。網頁版的 /r/:taskId/:reportId 那種深層連結要能對得上。
  go_router: ^14.2.7

  google_sign_in: ^7.0.0

  http: ^1.2.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 領域層的測試用純 Dart 的 package:test，不是 flutter_test。
  #
  # 這不只是輕量的問題 —— 它讓「lib/domain/ 不准 import Flutter」變成一件
  # 編譯器會抓的事，而不是靠自律。算錢的邏輯要能在沒有 widget 環境的地方
  # 驗證，跟網頁版把純函式跟 Vue 分開是同一個理由。
  test: ^1.25.0

flutter:
  uses-material-design: true
